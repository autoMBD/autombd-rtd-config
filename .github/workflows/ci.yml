name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    name: Python ${{ matrix.python-version }} deterministic suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check version and release-manifest integrity
        run: python tools/generate_release_manifest.py --check
      - name: Run deterministic suite
        run: python -m pytest

  deploy-smoke:
    name: ${{ matrix.os }} clean deploy smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run clean-directory outside-repository deployment smoke
        run: >-
          python -m pytest tests/unit/test_deploy_rtd_skill.py
          -k clean_deploy_contains_exact_manifest_set_and_runs_outside_repo
