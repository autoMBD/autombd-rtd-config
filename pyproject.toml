# pyproject.toml
[project]
name = "rtd-cfgfile-cli"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
rtd-config = "rtd_config.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# NOTE: -s (capture disabled) is required on this host. Under pytest's default
# fd-level capture, sys.stdin's OS handle (fd 0) is invalidated, and the many
# subprocess-based CLI tests inherit that broken handle, causing
# `OSError: [WinError 6]` from DuplicateHandle when spawning `python -m
# rtd_config`. Disabling capture keeps real, inheritable std handles in place
# so the documented `python -m pytest ... -q` command runs green.
addopts = "-s"
